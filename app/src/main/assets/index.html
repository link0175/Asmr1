<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ASMR</title>
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { font-family: "Neucha", "Comic Sans MS", system-ui, sans-serif; color: #f3ecd8; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sub { position: fixed; left: 50%; bottom: max(6vh, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(88vw, 900px); text-align: center; font-size: clamp(16px, 3.4vh, 30px); line-height: 1.25;
    text-shadow: 0 0 4px #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    transition: opacity .5s; opacity: 0; pointer-events: none; }
  #hint { position: fixed; top: max(4vh, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    font-size: clamp(13px, 2.6vh, 20px); opacity: 0; transition: opacity .6s; pointer-events: none; text-align: center;
    background: #0009; padding: 6px 14px; border-radius: 6px; border: 2px solid #f3ecd855; white-space: nowrap; }
  #ui { position: fixed; left: 0; right: 0; bottom: 18vh; display: flex; justify-content: center; pointer-events: none; }
  .choice { display: flex; gap: 4vw; flex-wrap: wrap; justify-content: center; align-items: center; flex-direction: column; }
  .choice .row { display: flex; gap: 4vw; }
  .btn { pointer-events: auto; font-family: inherit; font-size: clamp(16px, 3.6vh, 28px); color: #f3ecd8; cursor: pointer;
    background: #0b0b10dd; border: 3px solid #f3ecd8; border-radius: 4px; padding: 12px 22px;
    box-shadow: 5px 5px 0 #000; transform: rotate(-1deg); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  .btn:active { transform: scale(.95); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .timer { width: min(60vw, 520px); height: 6px; background: #f3ecd833; border: 2px solid #000; margin-top: 14px; }
  .timer i { display: block; height: 100%; width: 100%; background: #f3ecd8; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: radial-gradient(circle at 50% 40%, #1b2236, #05060a 70%); z-index: 10; transition: opacity 1s; }
  .screen h1 { margin: 0; font-size: clamp(48px, 14vh, 120px); letter-spacing: .25em; font-weight: 400;
    text-shadow: 4px 4px 0 #000, 0 0 30px #b9c6ff44; }
  .screen h2 { margin: .3em 0 .2em; font-weight: 400; font-size: clamp(18px, 4.5vh, 34px); color: #e9c46a; text-shadow: 2px 2px 0 #000; }
  .screen p { margin: .3em 0 1.4em; opacity: .7; font-size: clamp(14px, 2.8vh, 20px); }
  .screen .btn { animation: none; }
  #end { display: none; }
  #rotate { position: fixed; inset: 0; z-index: 20; background: #000e; display: none; align-items: center; justify-content: center;
    flex-direction: column; font-size: 22px; text-align: center; padding: 20px; }
  @media (orientation: portrait) { #rotate.show { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sub"></div>
<div id="hint"></div>
<div id="ui"></div>

<div class="screen" id="title">
  <h1>ASMR</h1>
  <h2>Эпизод 1 · Ночная трасса</h2>
  <p>Интерактивный фильм · 🎧 лучше в наушниках и в темноте</p>
  <button class="btn" id="start">▶ Начать</button>
</div>
<div class="screen" id="end">
  <h2 style="font-size:clamp(28px,7vh,56px)">Продолжение следует…</h2>
  <p id="endtxt"></p>
  <div style="display:flex;gap:20px">
    <button class="btn" id="again">↺ Другой выбор</button>
    <button class="btn" id="restart">⏮ Сначала</button>
  </div>
</div>
<div id="rotate" class="show">📱↻<br><br>Поверни телефон горизонтально<br><br><button class="btn" onclick="this.parentNode.classList.remove('show')">Играть так</button></div>

<script>
// =================== БАЗА ===================
const W = 1280, H = 720;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const dk = document.createElement('canvas'); dk.width = W; dk.height = H; const dg = dk.getContext('2d');
const subEl = document.getElementById('sub'), hintEl = document.getElementById('hint'), ui = document.getElementById('ui');
let scale = 1, ox = 0, oy = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, ease = k => k * k * (3 - 2 * k);
let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const R = (a, b) => a + Math.random() * (b - a);
const INK = '#060609'; let LWK = 1;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(cv.width / W, cv.height / H); ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

function P(pts, fill, lw = 4) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw * LWK; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); }
}
function circ(x, y, r, fill, lw = 0) { g.beginPath(); g.arc(x, y, r, 0, 7); if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw * LWK; g.strokeStyle = INK; g.stroke(); } }
function ell(x, y, rx, ry, fill, lw = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw * LWK; g.strokeStyle = INK; g.stroke(); } }
const hx = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function mix(a, b, k) { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function toVirtual(x, y) { const p = g.getTransform().transformPoint(new DOMPoint(x, y)); return [(p.x - ox) / scale, (p.y - oy) / scale]; }

// плёночное зерно + виньетка (комиксный кинолук)
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const x = grain.getContext('2d'), im = x.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 26; } x.putImageData(im, 0, 0); }
const grainPat = g.createPattern(grain, 'repeat');
function post() {
  g.save(); g.globalCompositeOperation = 'overlay'; g.translate(-Math.random() * 256, -Math.random() * 256);
  g.fillStyle = grainPat; g.fillRect(0, 0, W + 256, H + 256); g.restore();
  const v = g.createRadialGradient(640, 360, 260, 640, 360, 820);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
// фонарик: темнота с "дырой" света
function flashlight(x, y, r = 200, on = 1, dark = .93) {
  dg.globalCompositeOperation = 'source-over'; dg.clearRect(0, 0, W, H);
  dg.fillStyle = `rgba(1,2,6,${dark})`; dg.fillRect(0, 0, W, H);
  if (on > 0) {
    dg.globalCompositeOperation = 'destination-out';
    const a = dg.createRadialGradient(x, y, 0, x, y, r);
    a.addColorStop(0, `rgba(0,0,0,${on})`); a.addColorStop(.68, `rgba(0,0,0,${.94 * on})`);
    a.addColorStop(.78, `rgba(0,0,0,${.45 * on})`); a.addColorStop(1, 'rgba(0,0,0,0)');
    dg.fillStyle = a; dg.beginPath(); dg.arc(x, y, r, 0, 7); dg.fill();
    const b = dg.createRadialGradient(x, y, 0, x, y, r * 3.2);
    b.addColorStop(0, `rgba(0,0,0,${.28 * on})`); b.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = b; dg.fillRect(0, 0, W, H);
  }
  g.drawImage(dk, 0, 0);
  if (on > 0) { g.save(); g.globalCompositeOperation = 'lighter'; const w = g.createRadialGradient(x, y, 0, x, y, r); w.addColorStop(0, `rgba(255,214,150,${.11 * on})`); w.addColorStop(1, 'rgba(255,214,150,0)'); g.fillStyle = w; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); }
}
function glow(x, y, r, rgb, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(.25, `rgba(${rgb},${a * .4})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function pine(x, yb, h, col, lw = 3) {
  const w = h * .3;
  P([x - w * .07, yb, x + w * .07, yb, x + w * .05, yb - h * .3, x - w * .05, yb - h * .3], '#120e0b', lw);
  for (let i = 3; i >= 0; i--) { const top = yb - h + i * h * .17, bot = yb - h * .62 + i * h * .14, ww = w * (.45 + i * .2); P([x, top, x + ww, bot, x + ww * .3, bot - h * .03, x - ww * .3, bot - h * .03, x - ww, bot], col, lw); }
}
function kf(list, t) {
  if (t <= list[0][0]) return [list[0][1], list[0][2]];
  for (let i = 1; i < list.length; i++) if (t <= list[i][0]) { const a = list[i - 1], b = list[i], k = ease((t - a[0]) / (b[0] - a[0])); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
  const l = list[list.length - 1]; return [l[1], l[2]];
}

// =================== ЗВУК (всё синтезируется) ===================
let ctx, master, wet, noiseBuf, brownBuf, outNode, eng = null, night = null;
function initAudio() {
  if (ctx) { ctx.resume(); return; }
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master = ctx.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ctx.destination);
  const len = ctx.sampleRate * 3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
  const conv = ctx.createConvolver(); conv.buffer = ir; wet = ctx.createGain(); wet.gain.value = .5; wet.connect(conv); conv.connect(master);
  const n = ctx.sampleRate * 3; noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate); brownBuf = ctx.createBuffer(1, n, ctx.sampleRate);
  const w = noiseBuf.getChannelData(0), br = brownBuf.getChannelData(0); let last = 0;
  for (let i = 0; i < n; i++) { w[i] = Math.random() * 2 - 1; last = (last + .02 * w[i]) / 1.02; br[i] = last * 3.5; }
  outNode = master;
}
const A = () => !!ctx;
function bus(rev = .2, pan = 0, gain = 1) {
  const gg = ctx.createGain(); gg.gain.value = gain;
  const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null; let o = gg;
  if (p) { p.pan.value = pan; gg.connect(p); o = p; }
  o.connect(outNode); if (rev) { const s = ctx.createGain(); s.gain.value = rev; o.connect(s); s.connect(wet); }
  return gg;
}
function nz(dest, t, dur, o = {}) {
  const s = ctx.createBufferSource(); s.buffer = o.brown ? brownBuf : noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur); f.Q.value = o.q ?? 1;
  const gg = ctx.createGain(), a = Math.min(o.a ?? .002, dur * .8);
  gg.gain.setValueAtTime(.0001, t); gg.gain.exponentialRampToValueAtTime(o.g ?? .5, t + a); gg.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(gg); gg.connect(dest); s.start(t, Math.random() * 2); s.stop(t + dur + .05);
}
function tn(dest, t, freq, dur, o = {}) {
  const os = ctx.createOscillator(); os.type = o.type || 'sine'; os.frequency.setValueAtTime(freq, t);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + (o.fd || dur));
  const gg = ctx.createGain(), a = Math.min(o.a ?? .003, dur * .8);
  gg.gain.setValueAtTime(.0001, t); gg.gain.exponentialRampToValueAtTime(o.g ?? .3, t + a); gg.gain.exponentialRampToValueAtTime(.0001, t + dur);
  os.connect(gg); gg.connect(dest); os.start(t); os.stop(t + dur + .05);
}
function src(buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s; }
function filt(type, f, q = .7) { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
function gain(v) { const x = ctx.createGain(); x.gain.value = v; return x; }

// мотор, приглушённый салоном
function startEngine() {
  if (!A() || eng) return; const now = ctx.currentTime;
  const out = gain(.0001); out.gain.exponentialRampToValueAtTime(.65, now + 2.5); out.connect(master);
  const lp = filt('lowpass', 170); lp.connect(out);
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60; const a1 = gain(.22); o1.connect(a1); a1.connect(lp);
  const o2 = ctx.createOscillator(); o2.frequency.value = 30; const a2 = gain(.3); o2.connect(a2); a2.connect(out);
  const rs = src(brownBuf), rf = filt('lowpass', 450), rg = gain(.4); rs.connect(rf); rf.connect(rg); rg.connect(out);
  o1.start(); o2.start(); rs.start();
  eng = { out, o1, o2, rg, rf, nodes: [o1, o2, rs] };
}
function setEngine(v) {
  if (!eng) return; const now = ctx.currentTime;
  eng.o1.frequency.setTargetAtTime(34 + v * 1.3, now, .4); eng.o2.frequency.setTargetAtTime(17 + v * .65, now, .4);
  eng.rg.gain.setTargetAtTime(.04 + v / 22 * .45, now, .4); eng.rf.frequency.setTargetAtTime(240 + v * 10, now, .4);
}
function engineOff() {
  if (!eng) return; const now = ctx.currentTime, e = eng; eng = null;
  e.o1.frequency.cancelScheduledValues(now); e.o1.frequency.setValueAtTime(e.o1.frequency.value, now); e.o1.frequency.exponentialRampToValueAtTime(14, now + 1);
  e.out.gain.setTargetAtTime(.0001, now + .2, .25);
  setTimeout(() => e.nodes.forEach(n => { try { n.stop(); } catch (_) { } }), 2500);
}
function tick() { if (!A()) return; const t = ctx.currentTime, b = bus(.05, -.2); nz(b, t + .01, .012, { f: 2200, q: 6, g: .22 }); nz(b, t + .39, .012, { f: 1700, q: 6, g: .17 }); }
function clickSnd(t = 0) { if (!A()) return; const t0 = ctx.currentTime + t, b = bus(.1, .3); nz(b, t0, .008, { f: 3200, q: 5, g: .4 }); nz(b, t0 + .06, .008, { f: 2600, q: 5, g: .3 }); }
function doorOpen(t = 0) { if (!A()) return; const t0 = ctx.currentTime + t, b = bus(.1, -.4); nz(b, t0, .015, { type: 'highpass', f: 2500, g: .4 }); tn(b, t0 + .01, 120, .07, { g: .25 }); nz(b, t0 + .1, .6, { f: 700, q: 5, g: .06, a: .2 }); }
function doorSlam(t = 0) { if (!A()) return; const t0 = ctx.currentTime + t, b = bus(.35, -.3); nz(b, t0, .3, { type: 'lowpass', f: 230, g: .9, a: .003 }); tn(b, t0, 72, .25, { f2: 45, g: .6 }); nz(b, t0, .05, { f: 1500, g: .12 }); }
function footstep(kind) {
  if (!A()) return; const t = ctx.currentTime + .01, b = bus(.08, R(-.2, .2));
  if (kind === 'gravel') { for (let i = 0; i < 16; i++) nz(b, t + R(0, .13), R(.005, .02), { f: R(1500, 4500), q: 1, g: R(.08, .28), a: .0005 }); nz(b, t, .09, { type: 'lowpass', f: 160, g: .35 }); }
  else { nz(b, t, .24, { type: 'lowpass', f: 1300, g: .22, a: .05 }); for (let i = 0; i < 8; i++) nz(b, t + R(0, .2), R(.006, .015), { f: R(2000, 4500), q: 2, g: R(.04, .12), a: .0005 }); nz(b, t, .08, { type: 'lowpass', f: 140, g: .25 }); }
}
function twig(gn = 1) { if (!A()) return; const t = ctx.currentTime + .02, b = bus(.35, R(-.9, .9)); const k = 1 + (Math.random() * 3 | 0); for (let i = 0; i < k; i++) nz(b, t + i * R(.04, .12), R(.008, .02), { type: 'highpass', f: R(1500, 3000), g: R(.08, .2) * gn, a: .001 }); }
function sting(level = 1) {
  if (!A()) return; const now = ctx.currentTime, b = bus(.6, 0, level);
  [55, 58.3, 82.4].forEach(f => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const lp = filt('lowpass', 260), gg = gain(.0001); gg.gain.exponentialRampToValueAtTime(.12, now + 2.5); gg.gain.exponentialRampToValueAtTime(.0001, now + 7.5); o.connect(lp); lp.connect(gg); gg.connect(b); o.start(now); o.stop(now + 7.6); });
  tn(b, now + .5, 1760, 5, { g: .02, a: 2 }); tn(b, now + .5, 1791, 5, { g: .015, a: 2 });
}
// ночь: ветер, сверчки, совы, ветки
function startNight() {
  if (!A() || night) return; const now = ctx.currentTime;
  const out = gain(.0001); out.gain.exponentialRampToValueAtTime(1, now + 3); out.connect(master);
  const s = src(noiseBuf), f = filt('bandpass', 450, .6), wg = gain(.05);
  const l1 = ctx.createOscillator(); l1.frequency.value = .07; const l1g = gain(.035); l1.connect(l1g); l1g.connect(wg.gain);
  const l2 = ctx.createOscillator(); l2.frequency.value = .045; const l2g = gain(180); l2.connect(l2g); l2g.connect(f.frequency);
  s.connect(f); f.connect(wg); wg.connect(out); s.start(); l1.start(); l2.start();
  night = { out, nodes: [s, l1, l2], owl: now + R(7, 12), twig: now + R(4, 8),
    cr: [{ pan: -.7, f: 4300, next: 0, p: 1.1 }, { pan: .55, f: 4700, next: .4, p: .9 }, { pan: .1, f: 3900, next: .8, p: 1.3 }] };
}
function stopNight() { if (!night) return; const n = night; night = null; n.out.gain.setTargetAtTime(.0001, ctx.currentTime, .4); setTimeout(() => n.nodes.forEach(x => { try { x.stop(); } catch (_) { } }), 2000); }
function tickNight() {
  if (!night) return; const now = ctx.currentTime, prev = outNode; outNode = night.out;
  const on = (now % 11) < 7.5; // сверчки стрекочут периодически
  night.cr.forEach(c => { if (now >= c.next) { c.next = now + c.p * R(.9, 1.1); if (on) { const b = bus(.3, c.pan); for (let i = 0; i < 3; i++) tn(b, now + .02 + i * .055, c.f, .03, { g: .022, a: .004 }); } } });
  if (now > night.owl) { night.owl = now + R(22, 40); const b = bus(.9, R(-.8, .8)), t0 = now + .05; tn(b, t0, 410, .5, { f2: 390, g: .07, a: .12 }); tn(b, t0 + .75, 415, .35, { f2: 395, g: .055, a: .08 }); tn(b, t0 + 1.15, 410, .55, { f2: 380, g: .06, a: .1 }); }
  if (now > night.twig) { night.twig = now + R(7, 16); twig(); }
  outNode = prev;
}

// =================== СЦЕНА 1: ПОЕЗДКА ===================
const HZ = 330, FOC = 520, CAMH = 1.35, STOPZ = 253, SIGNZ = STOPZ + 14, DITCHZ = STOPZ + 40;
const zAt = t => t < 9 ? 22 * t : (u => 198 + 22 * u - 2.2 * u * u)(Math.min(t - 9, 5));
const vAt = t => t < 9 ? 22 : Math.max(0, 22 - 4.4 * (t - 9));
const proj = (X, Y, d) => { const s = FOC / d; return [640 + X * s, HZ + (CAMH - Y) * s, s]; };
const dtrees = []; seed = 5;
for (let z = 10; z < STOPZ + 220; z += 4 + rnd() * 7) for (const side of [-1, 1]) { if (rnd() < .25) continue; const X = side * (7 + rnd() * 12); if (side > 0 && Math.abs(z - DITCHZ) < 14) continue; dtrees.push({ z, X, Y: 0, h: 7 + rnd() * 7 }); }
dtrees.push({ z: DITCHZ + 3, X: 8, Y: -2, h: 11 }, { z: DITCHZ + 4, X: 11.5, Y: -2, h: 12 }, { z: DITCHZ + 9, X: 9.6, Y: -2, h: 10 });
const stars = []; for (let i = 0; i < 70; i++) stars.push([rnd() * W, rnd() * 300, rnd() * 1.4 + .4, rnd() * 6]);
const tline = []; for (let x = -40; x <= W + 40; x += 18) tline.push(x, -(12 + rnd() * 34));

function drawSky(hz, T) {

      if (this.k < 1 || this.p >= 1) return;
      this.from = this.p; this.to = Math.min(1, this.p + 1 / 8); this.k = 0; this.steps++;
      footstep(this.steps <= 2 ? 'gravel' : 'grass'); if (Math.random() < .3) setTimeout(twig, 400);
      if (this.steps === 1) setHint('');
      if (this.steps === 3) setSub('Склон уходит вниз, к деревьям. Осторожно…');
      if (this.steps === 6) setSub('Машина. Застряла между стволами.');
    },
    update(dt) {
      if (this.k < 1) { this.k = Math.min(1, this.k + dt / .65); this.p = lerp(this.from, this.to, ease(this.k)); this.bob = Math.sin(this.k * Math.PI) * 14; } else this.bob = Math.sin(T * 1.5) * 2;
      if (this.p >= 1 && this.k >= 1) { this.done += dt; if (this.done > 1.2) go('choice'); }
    },
    draw() { drawSlope(1 + this.p * 2.2, this.bob, T); flashlight(light.x, light.y, 190); drawCarLightsGlow(); post(); }
  },
  choice: {
    enter() {
      setSub('Тишина. Фонари всё горят.');
      setTimeout(() => cur === SC.choice && choice([
        ['Осмотреться', () => { choiceMade = 'look'; fadeTo('look', 1.6); }],
        ['Подойти к водителю (слева)', () => { choiceMade = 'driver'; fadeTo('driver', 1.6); }],
      ], 10, 0), 1200);
    },
    draw() { drawSlope(3.2, Math.sin(T * 1.5) * 2, T); flashlight(light.x, light.y, 190); drawCarLightsGlow(); post(); }
  },
  look: {
    subs: [[.5, 3.4, 'Свечу под ноги…'], [3.6, 6.6, 'Еле заметный тормозной след.'], [6.9, 10.5, 'А впереди, между деревьев… силуэт в плаще.']],
    key: [[0, 640, 700], [1.5, 610, 630], [3.2, 430, 520], [4.2, 330, 470], [5.4, 700, 420], [6.6, 930, 260], [11, 930, 280]],
    enter() { this.s = 0; this.tw = 0; },
    update() { if (st > 5.6 && !this.s) { this.s = 1; sting(1); } if (st > 7.6 && !this.tw) { this.tw = 1; twig(1.6); } if (st > 11.5) { this.end = 1; fadeTo(null, 2, showEnd); this.update = () => { }; } },
    draw() {
      drawLook(st, T); const [x, y] = kf(this.key, st);
      const on = (st > 8 && st < 8.6) ? (Math.sin(st * 90) > 0 ? .25 : 1) : 1;
      flashlight(x + Math.sin(T * 3) * 4, y + Math.cos(T * 2.3) * 4, 210, on); drawCarLightsGlow(); post();
    }
  },
  driver: {
    subs: [[.5, 3.6, 'Обхожу машину слева, к водительской двери.'], [4, 7.4, 'Свечу в окно…'], [7.6, 11.5, 'В салоне никого нет.']],
    key: [[0, 840, 540], [2.6, 720, 480], [4.2, 540, 380], [6, 430, 350], [7.6, 610, 350], [11, 600, 360]],
    enter() { this.s = 0; },
    update() { if (st > 7.5 && !this.s) { this.s = 1; sting(.6); } if (st > 12.5) { fadeTo(null, 2, showEnd); this.update = () => { }; } },
    draw() { drawDriver(st, T); const [x, y] = kf(this.key, st); flashlight(x + Math.sin(T * 3) * 4, y + Math.cos(T * 2.3) * 4, 210);
      if (amber) glow(amber[0], amber[1], 18, '255,170,40', .8); post(); }
  },
  black: { draw() { } }
};
SC.driver.update0 = SC.driver.update; SC.look.update0 = SC.look.update;

function showEnd() {
  go('black');
  document.getElementById('endtxt').textContent = choiceMade === 'look' ? 'Вы решили осмотреться — и вы здесь не одни.' : 'Вы подошли к водителю — но водителя нет.';
  const e = document.getElementById('end'); e.style.display = 'flex';
}
document.getElementById('again').onclick = () => { document.getElementById('end').style.display = 'none'; SC.look.update = SC.look.update0; SC.driver.update = SC.driver.update0; startNight(); go('choice'); };
document.getElementById('restart').onclick = () => { document.getElementById('end').style.display = 'none'; SC.look.update = SC.look.update0; SC.driver.update = SC.driver.update0; stopNight(); startEngine(); go('drive'); };
document.getElementById('start').onclick = () => {
  initAudio(); startEngine();
  const t = document.getElementById('title'); t.style.opacity = 0; setTimeout(() => t.style.display = 'none', 1000);
  go('drive');
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); } catch (_) { }
};

// управление: палец двигает фонарик, короткое нажатие — шаг
let down = null;
const toV = e => [(e.clientX * (cv.width / innerWidth) - ox) / scale, (e.clientY * (cv.height / innerHeight) - oy) / scale];
cv.addEventListener('pointerdown', e => { [light.tx, light.ty] = toV(e); down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
cv.addEventListener('pointermove', e => { [light.tx, light.ty] = toV(e); });
cv.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 14 && performance.now() - down.t < 400) cur && cur.tap && cur.tap(); down = null; });
document.addEventListener('visibilitychange', () => { if (!ctx) return; document.hidden ? ctx.suspend() : ctx.resume(); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (cur) { st += dt; cur.update && cur.update(dt); if (cur.subs) { const s = cur.subs.find(s => st >= s[0] && st < s[1]); setSub(s ? s[2] : ''); } }
  if (fade) { fade.t += dt; const h = fade.dur / 2; if (!fade.sw && fade.t >= h) { fade.sw = 1; if (fade.cb) fade.cb(); if (fade.name) go(fade.name); }
    fadeA = fade.t < h ? fade.t / h : 1 - (fade.t - h) / h; if (fade.t >= fade.dur) { fade = null; fadeA = 0; } }
  const k = Math.min(1, dt * 7); light.x += (light.tx - light.x) * k; light.y += (light.ty - light.y) * k;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(scale, 0, 0, scale, ox, oy); g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  if (cur && cur.draw) cur.draw(dt);
  if (fadeA > 0) { g.fillStyle = `rgba(0,0,0,${clamp(fadeA, 0, 1)})`; g.fillRect(0, 0, W, H); }
  g.restore();
  tickNight();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
